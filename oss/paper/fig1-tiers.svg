<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="Figure 1: where gpt-oss-120b lives on the test PC"><title>Figure 1: where gpt-oss-120b lives on the test PC</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs><rect width="1000" height="560" fill="#ffffff"/><text x="500" y="30" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">Figure 1 · where gpt-oss-120b (63.4 GB) lives on a 48 GB-VRAM, 30 GB-RAM PC</text><rect x="30" y="60" width="300" height="300" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/><text x="180" y="85" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1d4ed8" text-anchor="middle" font-weight="bold">GPU 0 · RX 9070 XT · 16 GB</text><rect x="50" y="100" width="260" height="60" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1"/><text x="62" y="122" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">layers 0-11: attention (Q8_0), norms, sinks,</text><text x="62" y="138" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">router (F32), expert biases  · ~0.4 GB</text><rect x="50" y="170" width="260" height="40" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1"/><text x="62" y="195" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">KV cache (f16), sliding-window rings</text><rect x="50" y="220" width="260" height="120" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="180" y="245" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="bold">expert cache: 1,079 slots</text><text x="180" y="268" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">the most-routed experts of layers 0-11</text><text x="180" y="284" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">12.6 MiB each (gate + up + down, MXFP4)</text><text x="180" y="300" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">picked by the saved profile,</text><text x="180" y="316" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">swapped as the routing drifts</text><rect x="360" y="60" width="300" height="300" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/><text x="510" y="85" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1d4ed8" text-anchor="middle" font-weight="bold">GPU 1 · AI PRO R9700 · 32 GB</text><rect x="380" y="100" width="260" height="60" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1"/><text x="392" y="122" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">layers 12-35 + output head (Q8_0, 0.6 GB)</text><text x="392" y="138" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">(+ EAGLE3 draft, 0.9 GB, optional)</text><rect x="380" y="170" width="260" height="40" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1"/><text x="392" y="195" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">KV cache, rings, prompt scratch</text><rect x="380" y="220" width="260" height="120" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text x="510" y="245" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="bold">expert cache: 2,252 slots</text><text x="510" y="268" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">the most-routed experts of layers 12-35</text><text x="510" y="284" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">VRAM experts are computed here</text><text x="510" y="300" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">(device-side routing: the GPU reads</text><text x="510" y="316" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">top-4 + the slot table itself)</text><rect x="690" y="60" width="280" height="300" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="830" y="85" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#b45309" text-anchor="middle" font-weight="bold">RAM · 30 GB DDR5</text><rect x="710" y="100" width="240" height="90" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1"/><text x="830" y="122" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">the other 1,277 experts</text><text x="830" y="138" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">15.7 GB, page-locked, planar MXFP4</text><text x="830" y="154" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">(the RAM holds exactly what</text><text x="830" y="170" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">the GPUs do not)</text><rect x="710" y="200" width="240" height="70" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.2"/><text x="830" y="222" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">CPU pool · 8 Zen 5 cores</text><text x="830" y="238" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">computes the missed experts in place</text><text x="830" y="254" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">AVX-512 VNNI MXFP4 x int8</text><rect x="710" y="280" width="240" height="60" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.2"/><text x="830" y="302" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">mailboxes (coherent host memory)</text><text x="830" y="318" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">routing in, CPU results out, flags</text><rect x="30" y="400" width="210" height="70" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="135" y="425" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">NVMe · the GGUF</text><text x="135" y="441" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">read once (~15 s)</text><line x1="135" y1="400" x2="135" y2="362" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><text x="145" y="385" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a" text-anchor="start" font-weight="normal">load</text><line x1="332" y1="290" x2="358" y2="290" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)" marker-start="url(#a0)"/><text x="372" y="380" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a" text-anchor="start" font-weight="normal">↔ residual hand-off between the GPUs</text><text x="372" y="394" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a" text-anchor="start" font-weight="normal">via host memory (11.5 KB a token)</text><path d="M 280 360 C 280 500, 800 500, 800 362" fill="none" stroke="#8c959f" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/><path d="M 560 360 C 560 450, 840 450, 840 362" fill="none" stroke="#8c959f" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="600" y="520" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#57606a" text-anchor="middle" font-weight="normal">PCIe 5.0 x8 each, 28.7 GB/s measured: hand-off flags (decode), missing experts streamed (prompt), swaps</text><text x="600" y="540" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#57606a" text-anchor="middle" font-weight="normal">decode: the CPU computes the misses · prompt: the GPU computes all, the misses streamed in</text></svg>
