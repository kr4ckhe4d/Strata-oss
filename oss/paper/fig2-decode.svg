<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-label="Figure 2: one layer of a decode step, GPU and CPU in parallel"><title>Figure 2: one layer of a decode step, GPU and CPU in parallel</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs><rect width="1000" height="520" fill="#ffffff"/><text x="500" y="30" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="bold">Figure 2 · one layer of a decode step: the GPU and the CPU each compute their share of the experts</text><rect x="20" y="50" width="960" height="170" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/><text x="36" y="72" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1d4ed8" text-anchor="start" font-weight="bold">GPU (one HIP graph per step; nothing launched from the host mid-step)</text><rect x="20" y="330" width="960" height="140" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="36" y="352" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#15803d" text-anchor="start" font-weight="bold">host + CPU pool</text><rect x="300" y="245" width="400" height="60" rx="8" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><text x="500" y="268" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#7e22ce" text-anchor="middle" font-weight="bold">LayerMailbox (page-locked, coherent)</text><text x="500" y="288" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">routed=seq · top-4 ids + weights · int8 FFN input · y_cpu · has_cpu · acked=seq</text><rect x="40" y="90" width="100" height="50" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1"/><text x="90" y="110" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">RMSNorm</text><text x="90" y="125" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">→ int8</text><rect x="150" y="90" width="100" height="50" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1"/><text x="200" y="110" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">QKV GEMV</text><text x="200" y="125" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">Q8_0 +bias</text><rect x="260" y="90" width="100" height="50" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1"/><text x="310" y="110" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">RoPE (YaRN)</text><text x="310" y="125" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">KV append</text><rect x="370" y="90" width="100" height="50" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1"/><text x="420" y="110" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">attention</text><text x="420" y="125" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">sinks · window</text><rect x="480" y="90" width="100" height="50" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1"/><text x="530" y="110" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">O-proj</text><text x="530" y="125" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">+ residual</text><line x1="140" y1="115" x2="150" y2="115" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><line x1="250" y1="115" x2="260" y2="115" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><line x1="360" y1="115" x2="370" y2="115" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><line x1="470" y1="115" x2="480" y2="115" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><rect x="590" y="90" width="110" height="50" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1"/><text x="645" y="110" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">norm · router</text><text x="645" y="125" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">top-4 · softmax</text><line x1="580" y1="115" x2="590" y2="115" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><rect x="720" y="90" width="120" height="50" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1"/><text x="780" y="110" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">VRAM experts</text><text x="780" y="125" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">gate/up → down</text><line x1="700" y1="115" x2="720" y2="115" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><rect x="860" y="90" width="105" height="50" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1"/><text x="912" y="110" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">wait ack</text><text x="912" y="125" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">x += y_gpu + y_cpu</text><line x1="840" y1="115" x2="860" y2="115" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><text x="40" y="175" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a" text-anchor="start" font-weight="normal">the expert kernels read top-4 and the slot table on the device;</text><text x="40" y="192" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a" text-anchor="start" font-weight="normal">a slot of -1 is skipped (that expert is the CPU's)</text><text x="40" y="209" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a" text-anchor="start" font-weight="normal">publish: one kernel writes routing + int8 input to host memory, fence, routed = seq</text><line x1="645" y1="140" x2="600" y2="245" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><text x="632" y="190" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a" text-anchor="start" font-weight="normal">publish</text><line x1="870" y1="245" x2="900" y2="140" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><text x="905" y="205" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a" text-anchor="start" font-weight="normal">ack</text><path d="M 700 275 C 760 275, 820 260, 875 248" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/><rect x="60" y="380" width="180" height="70" rx="6" fill="#ffffff" stroke="#15803d" stroke-width="1"/><text x="150" y="402" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">spin on routed == seq</text><text x="150" y="417" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">(host thread)</text><rect x="280" y="380" width="230" height="70" rx="6" fill="#ffffff" stroke="#15803d" stroke-width="1"/><text x="395" y="400" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">misses: experts with slot -1</text><text x="395" y="415" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">phase 1: gate/up rows (32-row units)</text><text x="395" y="430" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">phase 2: down rows · 8 workers</text><rect x="550" y="380" width="190" height="70" rx="6" fill="#ffffff" stroke="#15803d" stroke-width="1"/><text x="645" y="402" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">sum per column (job order)</text><text x="645" y="417" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">write y_cpu, has_cpu</text><rect x="780" y="380" width="180" height="70" rx="6" fill="#ffffff" stroke="#15803d" stroke-width="1"/><text x="870" y="402" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">acked = seq</text><text x="870" y="417" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">(release store)</text><line x1="240" y1="415" x2="280" y2="415" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><line x1="510" y1="415" x2="550" y2="415" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><line x1="740" y1="415" x2="780" y2="415" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><line x1="330" y1="305" x2="150" y2="380" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><line x1="870" y1="380" x2="700" y2="305" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><text x="500" y="500" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a" text-anchor="middle" font-weight="normal">a hit costs the GPU ~13 MB of reads at ~600 GB/s; a miss costs the CPU ~13 MB at DRAM speed. With 97% hits the CPU's part is short and often hidden.</text></svg>
