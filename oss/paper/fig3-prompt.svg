<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="Figure 3: the prompt path for one layer of a chunk"><title>Figure 3: the prompt path for one layer of a chunk</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs><rect width="1000" height="470" fill="#ffffff"/><text x="500" y="30" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="bold">Figure 3 · the prompt path (one layer, a chunk of up to 4,096 tokens)</text><rect x="30" y="60" width="135" height="52" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><text x="97" y="82" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">RMSNorm</text><text x="97" y="98" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">→ int8</text><rect x="187" y="60" width="135" height="52" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><text x="254" y="82" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">QKV</text><text x="254" y="98" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">int8 WMMA</text><line x1="165" y1="86" x2="187" y2="86" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><rect x="344" y="60" width="135" height="52" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><text x="411" y="82" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">RoPE</text><text x="411" y="98" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">KV write</text><line x1="322" y1="86" x2="344" y2="86" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><rect x="501" y="60" width="135" height="52" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><text x="568" y="82" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">attention</text><text x="568" y="98" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">f16 WMMA, tiled</text><line x1="479" y1="86" x2="501" y2="86" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><rect x="658" y="60" width="135" height="52" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><text x="725" y="82" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">O-proj</text><text x="725" y="98" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">int8 WMMA +res</text><line x1="636" y1="86" x2="658" y2="86" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><rect x="815" y="60" width="135" height="52" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><text x="882" y="82" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">router</text><text x="882" y="98" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">top-4 on GPU</text><line x1="793" y1="86" x2="815" y2="86" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><line x1="900" y1="112" x2="900" y2="150" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><rect x="560" y="150" width="410" height="70" rx="8" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><text x="765" y="172" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">host: copy top-4 back, group the assignments by expert;</text><text x="765" y="187" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">order = [experts in VRAM] then [missing ones, batches of 8];</text><text x="765" y="202" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">tiles of 32 tokens of one expert; pointer table per expert</text><rect x="30" y="250" width="940" height="90" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/><text x="46" y="270" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1d4ed8" text-anchor="start" font-weight="bold">compute stream</text><rect x="46" y="285" width="330" height="40" rx="5" fill="#fee2e2" stroke="#1d4ed8" stroke-width="1"/><text x="211.0" y="310" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">VRAM experts: gate/up + down</text><rect x="388" y="285" width="130" height="40" rx="5" fill="#fef3c7" stroke="#1d4ed8" stroke-width="1"/><text x="453.0" y="310" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">batch 1</text><rect x="530" y="285" width="130" height="40" rx="5" fill="#fef3c7" stroke="#1d4ed8" stroke-width="1"/><text x="595.0" y="310" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">batch 2</text><rect x="672" y="285" width="130" height="40" rx="5" fill="#fef3c7" stroke="#1d4ed8" stroke-width="1"/><text x="737.0" y="310" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">batch 3</text><rect x="814" y="285" width="90" height="40" rx="5" fill="#ffffff" stroke="#1d4ed8" stroke-width="1"/><text x="859.0" y="310" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">combine</text><rect x="30" y="360" width="940" height="70" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="46" y="380" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#475569" text-anchor="start" font-weight="bold">copy stream (PCIe, 28.7 GB/s)</text><rect x="46" y="390" width="140" height="30" rx="5" fill="#fef3c7" stroke="#b45309" stroke-width="1"/><text x="116" y="410" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">8 experts → ring 0</text><rect x="196" y="390" width="140" height="30" rx="5" fill="#fef3c7" stroke="#b45309" stroke-width="1"/><text x="266" y="410" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">8 experts → ring 1</text><rect x="346" y="390" width="140" height="30" rx="5" fill="#fef3c7" stroke="#b45309" stroke-width="1"/><text x="416" y="410" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">8 experts → ring 0</text><line x1="186" y1="390" x2="400" y2="325" stroke="#8c959f" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#a)"/><text x="245" y="372" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a" text-anchor="middle" font-weight="normal">event</text><line x1="336" y1="390" x2="540" y2="325" stroke="#8c959f" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#a)"/><text x="700" y="410" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a" text-anchor="middle" font-weight="normal">16-slot ring (2 x 8); a slot is refilled when the batch that read it has finished</text><text x="500" y="455" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a" text-anchor="middle" font-weight="normal">each missing expert crosses PCIe once per chunk and layer, whatever the chunk's size: the reason bigger chunks help (and cost VRAM)</text></svg>
