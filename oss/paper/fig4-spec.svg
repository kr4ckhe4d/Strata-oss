<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-label="Figure 4: a speculative step with the EAGLE3 draft"><title>Figure 4: a speculative step with the EAGLE3 draft</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs><rect width="1000" height="520" fill="#ffffff"/><text x="500" y="30" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="bold">Figure 4 · a speculative step: draft k tokens, verify them in one target step</text><rect x="30" y="60" width="560" height="200" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/><text x="46" y="82" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1d4ed8" text-anchor="start" font-weight="bold">target: gpt-oss-120b, one decode step over the window [t, d1 .. dk] (k ≤ 6)</text><rect x="50" y="110" width="200" height="50" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1"/><text x="150.0" y="140" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">layers 0-23</text><rect x="270" y="110" width="90" height="50" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1"/><text x="315.0" y="140" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">24-29</text><rect x="380" y="110" width="90" height="50" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1"/><text x="425.0" y="140" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">30-35</text><rect x="490" y="110" width="90" height="50" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1"/><text x="535.0" y="140" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="normal">head</text><line x1="250" y1="135" x2="270" y2="135" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><line x1="360" y1="135" x2="380" y2="135" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><line x1="470" y1="135" x2="490" y2="135" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><line x1="262" y1="160" x2="262" y2="205" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#a)"/><text x="262" y="222" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="normal">x→24</text><line x1="372" y1="160" x2="372" y2="205" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#a)"/><text x="372" y="222" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="normal">x→30</text><line x1="482" y1="160" x2="482" y2="205" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#a)"/><text x="482" y="222" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="normal">x after 35</text><text x="300" y="250" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a" text-anchor="start" font-weight="normal">taps: strided device copies inside the graph</text><rect x="610" y="60" width="360" height="200" rx="10" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><text x="626" y="82" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#7e22ce" text-anchor="start" font-weight="bold">accept (host)</text><text x="626" y="108" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">greedy: keep d_i while it is the target's argmax</text><text x="626" y="124" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">sampling: keep d_i with probability p(d_i), else</text><text x="626" y="140" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">   draw from p without d_i (exact sample of p)</text><text x="626" y="156" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">add the target's own next token</text><text x="626" y="172" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">drop the rejected positions' KV (truncate)</text><text x="626" y="188" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal"></text><text x="626" y="204" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">same placement ⇒ same tokens as no drafts</text><text x="626" y="220" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">(kernels built without -ffast-math)</text><line x1="590" y1="160" x2="610" y2="160" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><rect x="30" y="290" width="940" height="200" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="46" y="312" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#b45309" text-anchor="start" font-weight="bold">drafts: prompt lookup first (free), else EAGLE3 (one decoder layer on GPU 1)</text><rect x="50" y="330" width="180" height="80" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1"/><text x="140.0" y="352" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">features (3 x 2880)</text><text x="140.0" y="367" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">→ RMSNorm → fc</text><text x="140.0" y="382" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">g(p), into a ring</text><rect x="250" y="330" width="180" height="80" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1"/><text x="340.0" y="352" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">row p: emb(token p+1)</text><text x="340.0" y="367" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">‖ norm(g(p))</text><text x="340.0" y="382" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">→ q, k, v (5760 in)</text><rect x="450" y="330" width="180" height="80" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1"/><text x="540.0" y="352" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">attention (no sinks)</text><text x="540.0" y="367" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">own KV, llama RoPE</text><text x="540.0" y="382" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">base 500000, YaRN</text><rect x="650" y="330" width="180" height="80" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1"/><text x="740.0" y="352" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">SwiGLU 16384 · res</text><text x="740.0" y="367" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">→ prenorm state</text><text x="740.0" y="382" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">(g for the next row)</text><rect x="830" y="330" width="120" height="80" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1"/><text x="890.0" y="352" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">head: 49,152 ids</text><text x="890.0" y="367" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">argmax + its p</text><text x="890.0" y="382" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2328" text-anchor="middle" font-weight="normal">stop if p &lt; 0.6</text><line x1="230" y1="370" x2="250" y2="370" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><line x1="430" y1="370" x2="450" y2="370" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><line x1="630" y1="370" x2="650" y2="370" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><line x1="810" y1="370" x2="830" y2="370" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/><path d="M 740 410 C 740 470, 340 470, 340 412" fill="none" stroke="#b45309" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a)"/><text x="540" y="462" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a" text-anchor="middle" font-weight="normal">drafting: each next row feeds the previous row's prenorm state instead of g</text><text x="500" y="485" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a" text-anchor="middle" font-weight="normal">after a verify step the accepted positions' rows are recomputed with the target's real g (catch-up; prompts in 512-row pieces)</text><line x1="262" y1="230" x2="120" y2="330" stroke="#b91c1c" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#a)"/><line x1="890" y1="330" x2="560" y2="262" stroke="#b45309" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#a)"/><text x="800" y="284" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a" text-anchor="start" font-weight="normal">drafts d1..dk</text></svg>
